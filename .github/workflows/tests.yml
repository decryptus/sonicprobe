name: Foundation regression tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  consumers:
    name: Consumer compatibility (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    services:
      redis:
        image: redis:7.2.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/dwho
          ref: b9e46064ff87a8910a1f7450498c2c5fe4083c73
          path: consumers/dwho
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/httpdis
          ref: 22a9ebdd6ac014df68ae40f891e16742cb1c4fa9
          path: consumers/httpdis
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/auton
          ref: c98565679ad1738ad51321089dcfaee6e16a6fa8
          path: consumers/auton
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: decryptus/covenant
          ref: 59b72ef4ef7987465c840e39215badc87f52eefa
          path: consumers/covenant
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: decryptus/monit-docker
          ref: 2e1908b3da8cf352fcbe2346f575651f0fcff6ed
          path: consumers/monit-docker
          persist-credentials: false
      - name: Install candidate Sonicprobe with pinned consumer sources
        run: |
          python -m pip install . ./consumers/dwho ./consumers/httpdis mock packaging jmespath prometheus-client
          AUTON_PACKAGE=autond python -m pip install ./consumers/auton
          AUTON_PACKAGE=auton python -m pip install ./consumers/auton
          python -m pip install --no-deps ./consumers/covenant
          python -m pip install ./consumers/monit-docker
      - name: Verify the candidate and exercise consumers outside the Sonicprobe checkout
        env:
          DWHO_REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: |
          cd "$(mktemp -d)"
          python - "$GITHUB_WORKSPACE" <<'PY'
          import pathlib, sonicprobe, sys
          installed = pathlib.Path(sonicprobe.__file__).resolve().parent
          candidate = pathlib.Path(sys.argv[1]) / 'sonicprobe'
          assert installed != candidate.resolve()
          for relative in ('libs/xys.py', 'libs/keystore.py', 'libs/moresynchro.py', 'libs/workerpool.py',
                           'libs/threading_tcp_server.py', 'libs/threading_udp_server.py',
                           'libs/daemonize.py', 'libs/http_json_server.py',
                           'sp_logging/QueueSMTPHandler.py'):
              assert (installed / relative).read_bytes() == (candidate / relative).read_bytes(), relative
          PY
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/consumers/dwho/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/dwho/tests" -v
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/consumers/httpdis/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/httpdis/tests" -v
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/consumers/auton/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/auton/tests" -v
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/consumers/covenant/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/covenant/tests" -v
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/consumers/monit-docker/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/consumers/monit-docker/tests" -v
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/integration"
          python -m unittest discover -s "$GITHUB_WORKSPACE/integration" -v
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . "httpdis==0.6.27" "dwho==0.3.61" mock
      - name: Test the installed package outside the checkout
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/tests"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['2.7.18', '3.5', '3.6', '3.7', '3.8', '3.9']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and test with the legacy interpreter
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro"
          python:${{ matrix.python }}
          bash /src/.github/scripts/test-legacy.sh


  sql-access-modes:
    name: SQL access modes (real MySQL, MariaDB and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-password
          MYSQL_DATABASE: anysql_test
          MYSQL_USER: anysql
          MYSQL_PASSWORD: synthetic-test-password
        ports: ['33306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root-password
          MARIADB_DATABASE: anysql_test
          MARIADB_USER: anysql
          MARIADB_PASSWORD: synthetic-test-password
        ports: ['33307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: anysql_test
          POSTGRES_USER: anysql
          POSTGRES_PASSWORD: synthetic-test-password
        ports: ['35432:5432']
        options: >-
          --health-cmd "pg_isready -U anysql -d anysql_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQL drivers and the candidate package
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev pkg-config
          python -m pip install . mysqlclient psycopg2-binary
      - name: Verify access modes using installed AnySQL and disposable servers
        env:
          SONICPROBE_MYSQL_TEST_URL: mysql://anysql:synthetic-test-password@127.0.0.1:33306/anysql_test
          SONICPROBE_MARIADB_TEST_URL: mysql://anysql:synthetic-test-password@127.0.0.1:33307/anysql_test
          SONICPROBE_POSTGRESQL_TEST_URL: postgresql://anysql:synthetic-test-password@127.0.0.1:35432/anysql_test
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/sql_integration"
          python -m unittest discover -s "$GITHUB_WORKSPACE/sql_integration" -v

  sql-tls:
    name: Verified SQL TLS (PostgreSQL, MySQL and MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate and TLS test drivers
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev pkg-config
          python -m pip install . mysqlclient psycopg2-binary
      - name: Start disposable certificate fixtures
        run: bash .github/scripts/sql-tls-fixture.sh start "$RUNNER_TEMP/sql-tls-fixtures"
      - name: Verify actual TLS, certificates, hostname checks and access modes
        env:
          SONICPROBE_SQL_TLS_FIXTURES: ${{ runner.temp }}/sql-tls-fixtures
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest "$GITHUB_WORKSPACE/tls_integration"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tls_integration" -v
      - name: Stop disposable fixtures
        if: always()
        run: bash .github/scripts/sql-tls-fixture.sh stop
